<!-- <mat-slide-toggle>Toggle me!</mat-slide-toggle> -->
<mat-sidenav-container>
  <mat-sidenav
    #sidenav
    [fixedInViewport]="true"
    [mode]="sideNavMode"
    [opened]="!isSmallScreen"
  >
    <mat-toolbar color="primary"> Smart Examples </mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/users">Users</a>
      <a mat-list-item routerLink="/formFieldImputt">Form input field</a>
      <a mat-list-item routerLink="/progressBarSpinner"
        >Progress bar and Spinner</a
      >
      <a mat-list-item routerLink="/tabs">Tabs</a>
      <a mat-list-item routerLink="/datapicker">DataPicker</a>
      <a mat-list-item routerLink="/snackbar">Snackbar</a>
      <a mat-list-item routerLink="/dialog">Dialog</a>
      <a mat-list-item routerLink="/datatable">DataTable</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar
      class="toolbar-menu"
      color="primary"
      [class.mat-elevation-z4]="applyShadow"
    >
      <button
        mat-icon-button
        class="example-icon"
        aria-label="Example icon-button with menu icon"
        (click)="sidenav.toggle()"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <span *ngIf="popText">My App</span>
      <span class="example-spacer"></span>
      <button
        mat-icon-button
        class="example-icon favorite-icon"
        aria-label="Example icon-button with heart icon"
      >
        <mat-icon>favorite</mat-icon>
      </button>
      <button
        mat-icon-button
        class="example-icon"
        aria-label="Example icon-button with share icon"
      >
        <mat-icon>share</mat-icon>
      </button>
    </mat-toolbar>
    <mat-toolbar color="primary" class="toolbar-submenu">
      <span>My App</span>
    </mat-toolbar>

    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
