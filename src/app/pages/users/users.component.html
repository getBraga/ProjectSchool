<div class="content mat-elevation-z4">
  <app-toolbar-title title="Users" icon="list">
    <button mat-icon-button>
      <mat-icon>share</mat-icon>
    </button>
  </app-toolbar-title>
  <mat-tab-nav-panel #tabPanel> </mat-tab-nav-panel>
  <nav mat-tab-nav-bar ngClass="tabs" [tabPanel]="tabPanel">
    <a
      mat-tab-link
      routerLink="/users/myProfile"
      routerLinkActive="active-link"
    >
      <mat-icon>person</mat-icon>
      <span>Profile</span></a
    ><a
      mat-tab-link
      routerLink="/users/myDisciplines"
      routerLinkActive="active-link"
    >
      <mat-icon>play_lesson</mat-icon>
      <span>Disciplines</span></a
    ><a
      mat-tab-link
      routerLink="/users/myConquests"
      routerLinkActive="active-link"
    >
      <mat-icon>workspace_premium</mat-icon>
      <span>Conquests</span></a
    >
  </nav>

  <div class="container">
    <router-outlet></router-outlet>
  </div>
</div>
